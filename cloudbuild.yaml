# Deploys on every push to main — see bradjobe-dev-infra's
# cloudbuild_triggers.tf (google_cloudbuild_trigger.app["ccaas"]). Unlike
# the Cloud Run services, ccaas has no `gcloud run deploy` target: it's a
# GCE VM (needs a real Docker daemon for dockerode) with no public IP, so
# every step below reaches it through an IAP tunnel.
steps:
  - id: build-frontend
    name: node:22-slim
    dir: apps/frontend
    entrypoint: sh
    args:
      - -c
      - "npm install && npm run build"

  - id: build-sandbox-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_ARTIFACT_REGISTRY}/ccaas-sandbox:${SHORT_SHA}
      - docker/sandbox

  - id: build-proxy-image
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_ARTIFACT_REGISTRY}/ccaas-egress-proxy:${SHORT_SHA}
      - docker/proxy

  - id: push-images
    name: gcr.io/cloud-builders/docker
    entrypoint: sh
    args:
      - -c
      - |
        docker push ${_ARTIFACT_REGISTRY}/ccaas-sandbox:${SHORT_SHA}
        docker push ${_ARTIFACT_REGISTRY}/ccaas-egress-proxy:${SHORT_SHA}

  - id: package
    name: alpine
    entrypoint: sh
    args:
      - -c
      - |
        apk add --no-cache tar >/dev/null
        tar czf /workspace/ccaas.tar.gz \
          --warning=no-file-changed \
          --exclude=.git \
          --exclude=node_modules \
          --exclude=apps/backend/.env \
          --exclude=apps/frontend/node_modules \
          . || [ $? -eq 1 ]

  - id: copy-to-vm
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: sh
    args:
      - -c
      - |
        # A fresh OS Login SSH key (generated + uploaded on this container's
        # first gcloud compute call) needs a few seconds to propagate to the
        # VM's guest agent — the very first attempt reliably hits "Permission
        # denied (publickey)" before that lands. Every ccaas deploy starts
        # from a fresh container/fresh key, so this isn't a one-time fluke.
        for i in 1 2 3 4 5; do
          gcloud compute scp --tunnel-through-iap --zone=${_ZONE} \
            /workspace/ccaas.tar.gz ccaas-vm:/tmp/ccaas.tar.gz && exit 0
          echo "scp attempt $i failed, retrying in 15s..."
          sleep 15
        done
        exit 1

  - id: deploy-on-vm
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: sh
    args:
      - -c
      - |
        for i in 1 2 3 4 5; do
          gcloud compute ssh ccaas-vm --tunnel-through-iap --zone=${_ZONE} \
            --command="sudo mkdir -p /opt/ccaas && sudo tar xzf /tmp/ccaas.tar.gz -C /opt/ccaas && sudo chown -R root:root /opt/ccaas && sudo bash /opt/ccaas/infra/gcp-deploy.sh ${_ARTIFACT_REGISTRY} ${SHORT_SHA}" \
            && exit 0
          echo "ssh attempt $i failed, retrying in 15s..."
          sleep 15
        done
        exit 1

substitutions:
  # Must match bradjobe-dev-infra's var.zone (gce_ccaas.tf creates this VM
  # there) — -c, not -a, since that's the only zone in this region with
  # T4 GPU capacity and everything shares one zone. Update both together.
  _ZONE: northamerica-northeast1-c
  _ARTIFACT_REGISTRY: northamerica-northeast1-docker.pkg.dev/bradjobe-dev/apps

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
